<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Python and VS Code both connect to the SQL Server container" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Python and VS Code both connect to the SQL Server container</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0b5cad"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#cf222e"/></marker>
<marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/></marker>
</defs>
<rect width="720" height="340" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#24292f">One database, two ways in</text>
<rect x="20" y="80" width="190" height="110" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="115.0" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">Your Python file</text>
<text x="115.0" y="130" text-anchor="middle" font-size="12" fill="#24292f">coffee_cart_starter.py</text>
<text x="115.0" y="147" text-anchor="middle" font-size="12" fill="#24292f">c.execute(sql, params)</text>
<text x="115.0" y="164" text-anchor="middle" font-size="12" fill="#24292f">conn.commit()</text>
<rect x="265" y="100" width="170" height="70" rx="6" fill="#fff8c5" stroke="#9a6700"/>
<text x="350.0" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">mssql-python driver</text>
<text x="350.0" y="147" text-anchor="middle" font-size="12" fill="#24292f">connection + cursor</text>
<rect x="490" y="50" width="210" height="204" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="6 4"/>
<text x="595" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#57606a">Docker container</text>
<rect x="505" y="80" width="180" height="56" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="595.0" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">SQL Server 2025</text>
<text x="595.0" y="120" text-anchor="middle" font-size="12" fill="#24292f">listens on a local port</text>
<rect x="505" y="148" width="180" height="92" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="595.0" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">CoffeeCart database</text>
<text x="595.0" y="198" text-anchor="middle" font-size="12" fill="#24292f">MenuItem</text>
<text x="595.0" y="214" text-anchor="middle" font-size="12" fill="#24292f">CartOrder</text>
<line x1="212" y1="135" x2="263" y2="135" stroke="#0b5cad" stroke-width="2" marker-end="url(#a)"/>
<line x1="437" y1="135" x2="488" y2="135" stroke="#0b5cad" stroke-width="2" marker-end="url(#a)"/>
<rect x="265" y="262" width="170" height="62" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="350.0" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">VS Code MSSQL extension</text>
<text x="350.0" y="296" text-anchor="middle" font-size="12" fill="#24292f">run coffee_cart_setup.sql</text>
<text x="350.0" y="314" text-anchor="middle" font-size="12" fill="#24292f">SELECT to inspect</text>
<polyline points="437,293 595,293 595,256" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="232" font-size="12" fill="#24292f">Python changes data;</text><text x="20" y="250" font-size="12" fill="#24292f">the extension lets you look at it.</text>
<text x="20" y="276" font-size="12" fill="#24292f">Both reach the same tables.</text>
</svg>
