<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="What happens with and without commit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>What happens with and without commit</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0b5cad"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#cf222e"/></marker>
<marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/></marker>
</defs>
<rect width="720" height="310" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#24292f">Executing is not saving</text>
<text x="14" y="62" font-weight="bold" fill="#cf222e">Without commit()</text>
<text x="14" y="182" font-weight="bold" fill="#1a7f37">With commit()</text>
<rect x="14" y="72" width="152" height="64" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="90.0" y="90" text-anchor="middle" font-size="12" fill="#24292f">execute(INSERT)</text>
<text x="90.0" y="108" text-anchor="middle" font-size="12" fill="#24292f">change is held</text>
<text x="90.0" y="124" text-anchor="middle" font-size="12" fill="#24292f">(pending)</text>
<rect x="194" y="72" width="152" height="64" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="270.0" y="90" text-anchor="middle" font-size="12" fill="#24292f">Same connection:</text>
<text x="270.0" y="108" text-anchor="middle" font-size="12" fill="#24292f">COUNT(*) = 4</text>
<text x="270.0" y="124" text-anchor="middle" font-size="12" fill="#24292f">sees its own row</text>
<line x1="168" y1="104.0" x2="191" y2="104.0" stroke="#0b5cad" stroke-width="2" marker-end="url(#a)"/>
<line x1="348" y1="104.0" x2="371" y2="104.0" stroke="#cf222e" stroke-width="2" marker-end="url(#r)"/>
<line x1="528" y1="104.0" x2="551" y2="104.0" stroke="#cf222e" stroke-width="2" marker-end="url(#r)"/>
<rect x="374" y="72" width="152" height="64" rx="6" fill="#ffebe9" stroke="#cf222e"/>
<text x="450.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">Connection closes</text>
<text x="450.0" y="108" text-anchor="middle" font-size="12" fill="#cf222e">without commit</text>
<text x="450.0" y="124" text-anchor="middle" font-size="12" fill="#cf222e">pending row dropped</text>
<rect x="554" y="72" width="152" height="64" rx="6" fill="#ffebe9" stroke="#cf222e"/>
<text x="630.0" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">Database: 3 orders</text>
<text x="630.0" y="116" text-anchor="middle" font-size="12" fill="#cf222e">the order is lost</text>
<rect x="14" y="192" width="152" height="64" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="90.0" y="210" text-anchor="middle" font-size="12" fill="#24292f">execute(INSERT)</text>
<text x="90.0" y="228" text-anchor="middle" font-size="12" fill="#24292f">change is held</text>
<text x="90.0" y="244" text-anchor="middle" font-size="12" fill="#24292f">(pending)</text>
<rect x="194" y="192" width="152" height="64" rx="6" fill="#ddf4ff" stroke="#0b5cad"/>
<text x="270.0" y="210" text-anchor="middle" font-size="12" fill="#24292f">Same connection:</text>
<text x="270.0" y="228" text-anchor="middle" font-size="12" fill="#24292f">COUNT(*) = 4</text>
<text x="270.0" y="244" text-anchor="middle" font-size="12" fill="#24292f">sees its own row</text>
<line x1="168" y1="224.0" x2="191" y2="224.0" stroke="#0b5cad" stroke-width="2" marker-end="url(#a)"/>
<line x1="348" y1="224.0" x2="371" y2="224.0" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<line x1="528" y1="224.0" x2="551" y2="224.0" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<rect x="374" y="192" width="152" height="64" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="450.0" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">conn.commit()</text>
<text x="450.0" y="228" text-anchor="middle" font-size="12" fill="#1a7f37">change is saved</text>
<text x="450.0" y="244" text-anchor="middle" font-size="12" fill="#1a7f37">permanently</text>
<rect x="554" y="192" width="152" height="64" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="630.0" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">Database: 4 orders</text>
<text x="630.0" y="236" text-anchor="middle" font-size="12" fill="#1a7f37">everyone can see it</text>
<text x="360" y="288" text-anchor="middle" font-size="12" fill="#24292f">Your connection can see its own pending change. Other connections see it only after commit() (textbook pp. 492-493).</text>
</svg>
