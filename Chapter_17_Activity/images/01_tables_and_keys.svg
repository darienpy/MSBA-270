<text x="330" y="226" text-anchor="end" font-size="12" font-weight="bold" fill="#cf222e">no itemID 99 here: rejected</text>
<text x="540" y="210" text-anchor="middle" font-size="11" fill="#cf222e">hypothetical order (red)</text>
<rect x="20" y="240" width="680" height="48" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="32" y="260" font-size="12" fill="#24292f"><tspan font-weight="bold">PK</tspan> (primary key): a unique ID for each row.  <tspan font-weight="bold">FK</tspan> (foreign key): must match a PK in the other table.</text>
<text x="32" y="278" font-size="12" fill="#24292f">SQL Server refuses to store the red order because the menu has no item 99 (textbook pp. 472-475).</text>
</svg>
