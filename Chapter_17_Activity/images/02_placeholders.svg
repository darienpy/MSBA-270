<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="String-built SQL versus a placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>String-built SQL versus a placeholder</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0b5cad"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#cf222e"/></marker>
<marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/></marker>
</defs>
<rect width="720" height="340" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#24292f">Pasting values into SQL vs. using a ? placeholder</text>
<rect x="20" y="46" width="330" height="278" rx="8" fill="#fff5f5" stroke="#cf222e"/>
<rect x="370" y="46" width="330" height="278" rx="8" fill="#f2fbf4" stroke="#1a7f37"/>
<text x="185" y="70" text-anchor="middle" font-weight="bold" fill="#cf222e">String-built SQL (don't do this)</text>
<text x="535" y="70" text-anchor="middle" font-weight="bold" fill="#1a7f37">Placeholder ? (do this)</text>
<rect x="34" y="82" width="302" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="185.0" y="102" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#24292f">f"... WHERE name = '{name}'"</text>
<text x="185" y="140" text-anchor="middle" font-size="12" fill="#24292f">The text SQL Server receives:</text>
<rect x="34" y="150" width="302" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="44" y="171" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#24292f">WHERE name = <tspan fill="#0b5cad">'Baker'</tspan><tspan fill="#cf222e" font-weight="bold">s Dozen Donut Holes'</tspan></text>
<text x="185" y="214" text-anchor="middle" font-size="12" fill="#24292f">The apostrophe in Baker's ends the text early.</text>
<text x="185" y="232" text-anchor="middle" font-size="12" fill="#24292f">The leftover words are not valid SQL.</text>
<rect x="34" y="250" width="302" height="52" rx="6" fill="#ffebe9" stroke="#cf222e"/>
<text x="185.0" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">Result: syntax error</text>
<text x="185.0" y="288" text-anchor="middle" font-size="12" fill="#cf222e">(and a door for SQL injection)</text>
<rect x="384" y="82" width="302" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="535.0" y="102" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#24292f">c.execute(query, (name,))</text>
<rect x="384" y="130" width="302" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="535.0" y="148" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#24292f">SQL text: WHERE name = ?</text>
<rect x="384" y="172" width="302" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="535.0" y="190" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#24292f">values: ("Baker's Dozen Donut Holes",)</text>
<text x="535" y="222" text-anchor="middle" font-size="11" fill="#24292f">The SQL and the value travel separately.</text>
<line x1="535" y1="228" x2="535" y2="246" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<rect x="384" y="250" width="302" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="535.0" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">Result: found it</text>
<text x="535.0" y="288" text-anchor="middle" font-size="12" fill="#1a7f37">The value is data, never SQL</text>
</svg>
